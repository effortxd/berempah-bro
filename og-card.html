<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:'Karla',sans-serif;position:relative;background:#1C1006}
  .bg{position:absolute;inset:0;background:url("assets/hero.webp") center 42%/cover no-repeat}
  .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(28,16,6,.92) 0%,rgba(28,16,6,.72) 42%,rgba(28,16,6,.12) 75%)}
  .inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 70px 80px;color:#F5EBD8}
  .mascot{width:150px;margin-bottom:6px;margin-left:-10px}
  h1{font-family:'Anton',sans-serif;font-size:96px;line-height:.98;text-transform:uppercase;letter-spacing:.01em;text-shadow:4px 4px 0 rgba(0,0,0,.4)}
  h1 .gold{color:#E89B1C}
  .sub{font-size:30px;font-weight:700;margin-top:22px;max-width:560px;color:#F0E2C4}
  .hand{font-family:'Caveat',cursive;font-weight:600;font-size:40px;color:#FFDFA1;transform:rotate(-2deg);display:inline-block;margin-top:18px}
  .strip{position:absolute;left:0;right:0;bottom:0;background:#BE1E0D;border-top:3px solid #1C1006;padding:16px 70px;display:flex;justify-content:space-between;align-items:center;z-index:3}
  .strip span{font-family:'Anton',sans-serif;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#F5EBD8}
  .strip .gold{color:#E89B1C}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="inner">
    <img class="mascot" src="assets/logo-mark.webp" alt="">
    <h1>Spice. Crunch.<br><span class="gold">Shiok.</span></h1>
    <p class="sub">16-spice ayam goreng berempah by MasterChef Singapore winner Derek Cheong</p>
    <span class="hand">wah, die die must try lah!</span>
  </div>
  <div class="strip">
    <span>6 stalls islandwide</span>
    <span class="gold">#SpiceCrunchShiok</span>
    <span>@berempahbros</span>
  </div>
</body>
</html>
